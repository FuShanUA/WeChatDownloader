name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wechat_capture/**"
      - "wechat_launcher.py"
      - "build_windows_app.py"
      - "assets/wechat_downloader_icon.ico"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        run: python build_windows_app.py

      - name: Package Windows test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/WeChatDownloader.exe dist/package/
          Copy-Item WINDOWS_TEST.md dist/package/
          Copy-Item scripts/install_windows_dependencies.ps1 dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/WeChatDownloader-windows-test.zip -Force

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: WeChatDownloader-windows-test
          path: dist/WeChatDownloader-windows-test.zip
          if-no-files-found: error
