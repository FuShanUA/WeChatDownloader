name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "wechat_capture/**"
      - "wechat_launcher.py"
      - "build_windows_app.py"
      - "scripts/windows_one_click.ps1"
      - "1-一键安装.bat"
      - "2-启动 WeChatDownloader.bat"
      - "installer/wechatdownloader.iss"
      - "assets/wechat_downloader_icon.ico"
      - ".github/workflows/windows-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows executable
        run: python build_windows_app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer\wechatdownloader.iss"

      - name: Package Windows test bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/WeChatDownloader.exe dist/package/
          Copy-Item WINDOWS_TEST.md dist/package/
          Copy-Item "1-一键安装.bat" "dist/package/"
          Copy-Item "2-启动 WeChatDownloader.bat" "dist/package/"
          Compress-Archive -Path dist/package/* -DestinationPath dist/WeChatDownloader-windows-test.zip -Force

      - name: Upload Windows test bundle
        uses: actions/upload-artifact@v4
        with:
          name: WeChatDownloader-windows-test
          path: dist/WeChatDownloader-windows-test.zip
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WeChatDownloader-windows-installer
          path: dist/WeChatDownloader-Setup.exe
          if-no-files-found: error
